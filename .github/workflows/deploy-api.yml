name: Deploy API to EasyPanel

# Fires EasyPanel's deploy webhook only when api-relevant paths change.
# Requires:
#   - EasyPanel auto-deploy turned OFF for the sgm-api app
#   - The deploy-hook URL stored in this repo as the secret
#     EASYPANEL_API_DEPLOY_HOOK (Settings → Secrets and variables → Actions)
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger EasyPanel deploy
        env:
          HOOK: ${{ secrets.EASYPANEL_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "EASYPANEL_API_DEPLOY_HOOK secret is not set" >&2
            exit 1
          fi
          curl --fail --show-error --silent -X POST "$HOOK"
          echo "EasyPanel deploy hook fired."
