services:
  app:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "3333:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://root:sgm@db:3306/sgm
      JWT_SECRET: dev-jwt-secret-change-me
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: sgm
      MYSQL_DATABASE: sgm
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psgm"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
