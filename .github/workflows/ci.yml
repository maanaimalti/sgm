name: CI

# Also exposed as a reusable workflow so deploy-api.yml can gate on it —
# `needs:` cannot reference a job in another workflow file.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Migrations are applied for real here. Until Stage B this job only ever
      # ran `prisma generate`, so a mistake in hand-written SQL first surfaced
      # at container boot in production — where the CMD is
      # `migrate deploy && node dist/main`, meaning the API simply never starts.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # The web build inlines its public base url at compile time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_BASE_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Builds packages/shared (prepare) and runs prisma generate (postinstall).
      - run: pnpm install --frozen-lockfile

      # Applies every migration from an empty database, exactly as production
      # does. `migrate status` additionally catches the schema and the
      # migrations disagreeing, which nothing else in this pipeline can see.
      - run: pnpm --filter @sgm/api exec prisma migrate deploy
      - run: pnpm --filter @sgm/api exec prisma migrate status

      # Fails on any table left without RLS — including one added later and
      # forgotten. With the anon key in the browser bundle, that table would be
      # readable by anyone who opens the devtools.
      - run: pnpm --filter @sgm/api db:verify-rls

      - run: pnpm typecheck
      - run: pnpm lint:ci
      - run: pnpm test
      - run: pnpm build:api
      - run: pnpm build:web
